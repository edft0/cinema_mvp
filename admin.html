<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>관리자 대시보드 | 사월시네마</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <link rel="stylesheet" href="css/style.css">
</head>
<body class="bg-gray-50 text-[#343633] min-h-screen">
    <div class="grain-overlay opacity-[0.02]"></div>

    <nav class="bg-white border-b border-gray-200 px-6 py-4 flex justify-between items-center sticky top-0 z-50">
        <div class="flex items-center gap-2">
            <div class="w-8 h-8 bg-[#459375] rounded flex items-center justify-center text-white shadow-lg">
                <i data-lucide="layout-dashboard" class="w-5 h-5"></i>
            </div>
            <h1 class="text-xl font-black">April Admin</h1>
        </div>
        <div class="flex items-center gap-4">
            <button onclick="downloadCSV()" class="hidden md:flex bg-gray-100 hover:bg-gray-200 px-3 py-1.5 rounded-lg text-sm font-bold items-center gap-2 transition-all">
                <i data-lucide="download" class="w-4 h-4"></i>
                엑셀 다운로드
            </button>
            <button onclick="location.href='index.html'" class="text-sm font-bold hover:text-[#459375] flex items-center gap-1 transition-colors">
                <i data-lucide="external-link" class="w-4 h-4"></i>
                홈페이지
            </button>
        </div>
    </nav>

    <main class="max-w-6xl mx-auto p-4 md:p-8 space-y-8">
        <!-- Summary Cards -->
        <div class="grid grid-cols-1 md:grid-cols-3 gap-6">
            <div class="bg-white p-6 rounded-2xl shadow-sm border border-gray-100 flex items-center gap-4">
                <div class="w-12 h-12 bg-[#459375]/10 text-[#459375] rounded-xl flex items-center justify-center">
                    <i data-lucide="users" class="w-6 h-6"></i>
                </div>
                <div>
                    <p class="text-xs font-bold opacity-40 uppercase tracking-wider">총 예매 건수</p>
                    <p class="text-3xl font-black" id="stat-total">0</p>
                </div>
            </div>
            <div class="bg-white p-6 rounded-2xl shadow-sm border border-gray-100 flex items-center gap-4">
                <div class="w-12 h-12 bg-blue-50 text-blue-600 rounded-xl flex items-center justify-center">
                    <i data-lucide="calendar" class="w-6 h-6"></i>
                </div>
                <div>
                    <p class="text-xs font-bold opacity-40 uppercase tracking-wider">잔여석 합계</p>
                    <p class="text-3xl font-black" id="stat-remaining">40/40</p>
                </div>
            </div>
            <div class="bg-white p-6 rounded-2xl shadow-sm border border-gray-100 flex items-center gap-4">
                <div class="w-12 h-12 bg-orange-50 text-orange-600 rounded-xl flex items-center justify-center">
                    <i data-lucide="award" class="w-6 h-6"></i>
                </div>
                <div>
                    <p class="text-xs font-bold opacity-40 uppercase tracking-wider">인기 상영 시간</p>
                    <p class="text-lg font-black" id="stat-popular">-</p>
                </div>
            </div>
        </div>

        <!-- Reservation Table -->
        <div class="bg-white rounded-2xl shadow-sm border border-gray-100 overflow-hidden">
            <div class="px-6 py-5 border-b border-gray-100 flex justify-between items-center">
                <div>
                    <h2 class="text-lg font-black">예약자 명단</h2>
                    <p class="text-xs opacity-40">총 <span id="list-count">0</span>명의 예약자가 있습니다.</p>
                </div>
                <div class="flex gap-2">
                    <button onclick="renderAll()" class="p-2 hover:bg-gray-50 rounded-lg transition-colors">
                        <i data-lucide="rotate-cw" class="w-5 h-5 opacity-40"></i>
                    </button>
                </div>
            </div>
            <div class="overflow-x-auto">
                <table class="w-full text-left">
                    <thead class="bg-gray-50 text-[10px] uppercase font-black tracking-widest text-gray-400">
                        <tr>
                            <th class="px-6 py-4">이름</th>
                            <th class="px-6 py-4">학번</th>
                            <th class="px-6 py-4">연락처</th>
                            <th class="px-6 py-4">상영 시간</th>
                            <th class="px-6 py-4 text-right">관리</th>
                        </tr>
                    </thead>
                    <tbody id="reservation-list" class="divide-y divide-gray-50">
                        <!-- Data rows -->
                    </tbody>
                </table>
            </div>
            <div id="empty-state" class="hidden py-20 text-center space-y-4">
                <div class="w-20 h-20 bg-gray-50 rounded-full flex items-center justify-center mx-auto">
                    <i data-lucide="inbox" class="w-10 h-10 opacity-10"></i>
                </div>
                <p class="text-sm opacity-40 font-bold">아직 접수된 예약이 없습니다.</p>
            </div>
        </div>
    </main>

    <script src="js/storage.js"></script>
    <script>
        lucide.createIcons();

        function renderAll() {
            const reservations = CinemaStorage.getAll();
            const listElement = document.getElementById('reservation-list');
            const emptyState = document.getElementById('empty-state');
            const stats = CinemaStorage.getStats();
            
            // Update stats
            document.getElementById('stat-total').innerText = stats.total;
            document.getElementById('stat-remaining').innerText = `${40 - stats.total}/40`;
            document.getElementById('list-count').innerText = stats.total;
            
            // Popular time
            if (stats.total > 0) {
                const popular = Object.keys(stats.byTime).reduce((a, b) => stats.byTime[a] > stats.byTime[b] ? a : b);
                document.getElementById('stat-popular').innerText = popular.split(' ')[0] + ' ' + popular.split(' ')[1];
            } else {
                document.getElementById('stat-popular').innerText = '-';
            }

            // List render
            listElement.innerHTML = '';
            if (reservations.length === 0) {
                emptyState.classList.remove('hidden');
            } else {
                emptyState.classList.add('hidden');
                // Sort by newest
                reservations.reverse().forEach(res => {
                    const row = `
                        <tr class="hover:bg-gray-50/50 transition-colors">
                            <td class="px-6 py-4">
                                <p class="font-bold">${res.name}</p>
                                <p class="text-[10px] opacity-30 uppercase font-mono">${res.id.slice(-8)}</p>
                            </td>
                            <td class="px-6 py-4 text-sm font-medium opacity-60">${res.studentId}</td>
                            <td class="px-6 py-4 text-sm opacity-60">${res.contact}</td>
                            <td class="px-6 py-4">
                                <span class="bg-[#459375]/10 text-[#459375] px-2 py-1 rounded text-xs font-bold">${res.time}</span>
                            </td>
                            <td class="px-6 py-4 text-right">
                                <button onclick="deleteRes('${res.id}')" class="p-2 text-red-300 hover:text-red-500 transition-colors">
                                    <i data-lucide="trash-2" class="w-4 h-4"></i>
                                </button>
                            </td>
                        </tr>
                    `;
                    listElement.insertAdjacentHTML('beforeend', row);
                });
                lucide.createIcons();
            }
        }

        function deleteRes(id) {
            if (confirm('해당 예약을 삭제하시겠습니까? (이 작업은 되돌릴 수 없습니다.)')) {
                CinemaStorage.delete(id);
                renderAll();
            }
        }

        function downloadCSV() {
            const reservations = CinemaStorage.getAll();
            if (reservations.length === 0) {
                alert('다운로드할 데이터가 없습니다.');
                return;
            }

            const headers = ['ID', '이름', '학번', '연락처', '상영시간', '예약일시'];
            const rows = reservations.map(res => [
                res.id,
                res.name,
                res.studentId,
                res.contact,
                res.time,
                res.createdAt
            ]);

            let csvContent = "\uFEFF"; // UTF-8 BOM for Excel Korean support
            csvContent += headers.join(",") + "\n";
            rows.forEach(row => {
                csvContent += row.map(field => `"${field}"`).join(",") + "\n";
            });

            const blob = new Blob([csvContent], { type: 'text/csv;charset=utf-8;' });
            const link = document.createElement("a");
            const url = URL.createObjectURL(blob);
            link.setAttribute("href", url);
            link.setAttribute("download", "sawol_cinema_reservations.csv");
            link.style.visibility = 'hidden';
            document.body.appendChild(link);
            link.click();
            document.body.removeChild(link);
        }

        renderAll();
    </script>
</body>
</html>
