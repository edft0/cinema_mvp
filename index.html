<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>사월시네마 | 8월의 크리스마스</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <link rel="stylesheet" href="css/style.css">
    <style>
        /* 컬러-흑백 깜빡임 효과 */
        @keyframes poster-color-blink {
            0%, 100% { filter: grayscale(0); }
            50% { filter: grayscale(1); }
        }
        .blink-animation {
            animation: poster-color-blink 5s infinite ease-in-out;
        }

        .time-btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
            background-color: #f0f0f0;
            border-color: #ccc;
            color: #999;
        }

        /* 모달 스타일 */
        #lookup-modal {
            display: none;
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.6);
            backdrop-filter: blur(4px);
            z-index: 100;
            align-items: center;
            justify-content: center;
        }
        #lookup-modal.active {
            display: flex;
        }
    </style>
</head>
<body class="min-h-screen relative pb-20 bg-[#f3eee8]">
    <div class="grain-overlay"></div>
    <div class="projector-light"></div>

    <!-- Header -->
    <header class="pt-12 pb-8 text-center animate-fade-in">
        <h1 class="text-4xl md:text-5xl font-bold tracking-tighter text-[#343633]">사월시네마</h1>
        <p class="mt-2 text-sm opacity-60 font-serif">April Cinema</p>
    </header>

    <main class="w-full max-w-xl mx-auto px-6 space-y-12 animate-fade-in" style="animation-delay: 0.2s;">
        <!-- Movie Poster / Info -->
        <section class="text-center">
            <div class="relative inline-block group">
                <div class="absolute -inset-1 bg-[#459375] opacity-20 blur-xl group-hover:opacity-30 transition duration-1000"></div>
                <div class="relative bg-white p-2 shadow-2xl transform rotate-1">
                    <img src="assets/poster.jpg" 
                         alt="8월의 크리스마스 포스터" 
                         onerror="this.src='https://images.unsplash.com/photo-1536440136628-849c177e76a1?auto=format&fit=crop&q=80&w=1000'"
                         class="w-full h-80 object-cover transition-all duration-700 blink-animation">
                </div>
            </div>
            <div class="mt-6">
                <h2 class="text-2xl font-bold">8월의 크리스마스(1998)</h2>
                <p class="text-sm opacity-70 mt-1 font-serif">감독: 허진호 | 장르: 멜로/로맨스, 드라마</p>
            </div>
        </section>

        <!-- Time Selection -->
        <section class="space-y-4">
            <div class="flex items-center gap-2">
                <i data-lucide="clock" class="w-5 h-5 text-[#459375]"></i>
                <h3 class="text-lg font-bold">상영 시간 선택</h3>
            </div>
            <div class="grid grid-cols-1 sm:grid-cols-2 gap-3" id="time-selector">
                <button class="time-btn px-6 py-4 border-2 border-[#343633] border-opacity-10 rounded-xl hover:border-[#459375] hover:text-[#459375] transition-all text-left" data-time="5/11(월) 18:30 ~ 20:30">
                    <span class="block text-xs opacity-60">5/11 (월)</span>
                    <span class="block font-bold">18:30 ~ 20:30</span>
                    <span class="block text-[10px] mt-1 opacity-50 seat-count">(0/20)</span>
                </button>
                <button class="time-btn px-6 py-4 border-2 border-[#343633] border-opacity-10 rounded-xl hover:border-[#459375] hover:text-[#459375] transition-all text-left" data-time="5/12(화) 18:30 ~ 20:30">
                    <span class="block text-xs opacity-60">5/12 (화)</span>
                    <span class="block font-bold">18:30 ~ 20:30</span>
                    <span class="block text-[10px] mt-1 opacity-50 seat-count">(0/20)</span>
                </button>
            </div>
        </section>

        <!-- Reservation Form -->
        <section class="space-y-4 pb-12">
            <div class="flex items-center gap-2">
                <i data-lucide="user" class="w-5 h-5 text-[#459375]"></i>
                <h3 class="text-lg font-bold">예매 정보 입력</h3>
            </div>
            <form id="booking-form" class="space-y-4">
                <div class="space-y-1">
                    <label class="text-sm opacity-70 ml-1">이름</label>
                    <input type="text" id="name" required placeholder="예매자 성함을 입력해주세요" 
                           class="w-full bg-white border border-[#343633] border-opacity-10 rounded-xl px-4 py-3 focus:outline-none focus:ring-2 focus:ring-[#459375] transition-all">
                </div>
                <div class="space-y-1">
                    <label class="text-sm opacity-70 ml-1">학번</label>
                    <input type="text" id="studentId" required placeholder="25010000" 
                           class="w-full bg-white border border-[#343633] border-opacity-10 rounded-xl px-4 py-3 focus:outline-none focus:ring-2 focus:ring-[#459375] transition-all">
                </div>
                <div class="space-y-1">
                    <label class="text-sm opacity-70 ml-1">연락처</label>
                    <input type="tel" id="contact" required placeholder="010-1234-5678" 
                           class="w-full bg-white border border-[#343633] border-opacity-10 rounded-xl px-4 py-3 focus:outline-none focus:ring-2 focus:ring-[#459375] transition-all">
                </div>
                
                <button type="submit" class="w-full bg-[#459375] text-white py-4 rounded-xl font-bold text-lg hover:bg-[#3a7a61] transform active:scale-95 transition-all shadow-lg mt-4">
                    예매하기
                </button>
            </form>
            
            <div class="text-center">
                <button onclick="toggleModal(true)" class="text-sm opacity-50 hover:opacity-100 hover:text-[#459375] transition-all underline underline-offset-4">
                    이미 예매하셨나요? [예약 조회하기]
                </button>
            </div>
        </section>
    </main>

    <!-- Lookup Modal -->
    <div id="lookup-modal">
        <div class="bg-white w-full max-w-sm p-8 rounded-3xl shadow-2xl m-4 relative">
            <button onclick="toggleModal(false)" class="absolute top-6 right-6 opacity-30 hover:opacity-100">
                <i data-lucide="x" class="w-6 h-6"></i>
            </button>
            <h3 class="text-xl font-bold mb-6">예약 확인</h3>
            <p class="text-sm opacity-60 mb-6 leading-relaxed">예매 시 입력하신 성함과 학번을<br>입력해 주세요.</p>
            
            <div class="space-y-4">
                <input type="text" id="lookup-name" placeholder="성함" 
                       class="w-full bg-gray-50 border-0 rounded-xl px-5 py-4 focus:ring-2 focus:ring-[#459375] outline-none">
                <input type="text" id="lookup-studentId" placeholder="학번" 
                       class="w-full bg-gray-50 border-0 rounded-xl px-5 py-4 focus:ring-2 focus:ring-[#459375] outline-none">
                <button onclick="performLookup()" class="w-full bg-[#459375] text-white py-4 rounded-xl font-bold shadow-lg hover:bg-[#3a7a61] transition-all">
                    티켓 확인하기
                </button>
            </div>
        </div>
    </div>

    <!-- Footer -->
    <footer class="pb-12 text-center">
        <p class="text-sm opacity-60 font-serif">세종대학교 제39대 사회과학대학 학생회 '사월'</p>
    </footer>

    <script src="js/storage.js"></script>
    <script>
        lucide.createIcons();
        
        let selectedTime = '';
        const MAX_SEATS = 20;
        const timeButtons = document.querySelectorAll('.time-btn');
        
        function updateSeatDisplay() {
            timeButtons.forEach(btn => {
                const time = btn.dataset.time;
                const count = CinemaStorage.getCountByTime(time);
                const countSpan = btn.querySelector('.seat-count');
                countSpan.innerText = `(${count}/${MAX_SEATS})`;
                if (count >= MAX_SEATS) {
                    btn.disabled = true;
                    countSpan.innerText += ' [매진]';
                }
            });
        }
        updateSeatDisplay();
        
        timeButtons.forEach(btn => {
            btn.addEventListener('click', () => {
                if (btn.disabled) return;
                timeButtons.forEach(b => b.classList.remove('border-[#459375]', 'text-[#459375]', 'border-opacity-100', 'bg-[#459375]/5'));
                btn.classList.add('border-[#459375]', 'text-[#459375]', 'border-opacity-100', 'bg-[#459375]/5');
                selectedTime = btn.dataset.time;
            });
        });

        document.getElementById('booking-form').addEventListener('submit', (e) => {
            e.preventDefault();
            if (!selectedTime) { alert('상영 시간을 선택해주세요.'); return; }
            const studentId = document.getElementById('studentId').value;
            if (CinemaStorage.isDuplicate(studentId)) {
                alert('이미 예매된 학번입니다. 1인 1매만 가능합니다.');
                return;
            }
            const reservation = {
                name: document.getElementById('name').value,
                studentId: studentId,
                contact: document.getElementById('contact').value,
                time: selectedTime,
                movieTitle: '8월의 크리스마스'
            };
            try {
                const saved = CinemaStorage.save(reservation);
                window.location.href = `success.html?id=${saved.id}`;
            } catch (error) {
                alert(error.message);
                updateSeatDisplay();
            }
        });

        // 모달 제어
        function toggleModal(show) {
            document.getElementById('lookup-modal').classList.toggle('active', show);
        }

        // 예약 조회 실행
        function performLookup() {
            const name = document.getElementById('lookup-name').value;
            const studentId = document.getElementById('lookup-studentId').value;
            
            if (!name || !studentId) {
                alert('이름과 학번을 모두 입력해 주세요.');
                return;
            }

            const res = CinemaStorage.findReservation(name, studentId);
            if (res) {
                window.location.href = `success.html?id=${res.id}`;
            } else {
                alert('일치하는 예약 내역이 없습니다.\n입력하신 정보를 다시 확인해 주세요.');
            }
        }
    </script>
</body>
</html>
